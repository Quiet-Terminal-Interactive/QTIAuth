name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install NATS and Valkey for integration tests
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.11.9/nats-server-v2.11.9-linux-amd64.tar.gz | tar -xz
          sudo mv nats-server-*/nats-server /usr/local/bin/
          id=$(docker create valkey/valkey:8-bookworm) && sudo docker cp "$id:/usr/local/bin/valkey-server" /usr/local/bin/valkey-server && docker rm "$id"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:literals
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qtiauth:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qtiauth:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
