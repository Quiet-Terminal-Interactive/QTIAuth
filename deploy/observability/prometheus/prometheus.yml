global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    authorization:
      credentials_file: /tmp/prometheus-secrets/gateway-metrics-token
    static_configs:
      - targets: ["gateway:8081"]
  - job_name: services
    dns_sd_configs:
      - names: [identity, notifier, scheduler, web, oidc, safety, support, games, backup]
        type: A
        port: 3000
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
